image:
  repository: ghcr.io/keepguard/ms-auth
  tag: "1.0.4"
  pullPolicy: IfNotPresent

service:
  port: 8081

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi

env:
  springProfilesActive: local
  serverPort: 8081
  apiBaseUrl: "https://api.keepguard.com.br"
  frontendBaseUrl: "https://app.keepguard.com.br"
  companyServiceUrl: "http://ms-company:8083"
  userServiceUrl: "http://ms-user:8085"
  communicationServiceUrl: "http://ms-communication:8082"
  redisHost: "redis"
  redisPort: 6379
  postgresDb: "keepguard_api_db"
  postgresUser: "keepguard_api_user"

imagePullSecrets:
  - name: ghcr-secret
